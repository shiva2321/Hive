apiVersion: apps/v1
kind: Deployment
metadata:
  name: uam-api-deployment
  labels:
    app: uam-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: uam-api
  template:
    metadata:
      labels:
        app: uam-api
    spec:
      containers:
      - name: api
        image: uam-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 42424
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "42424"
        - name: STORAGE_MODE
          value: "postgres"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: uam-secrets
              key: database-url
        - name: ENCRYPTION_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: uam-secrets
              key: master-key
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz/liveness
            port: 42424
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: 42424
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: uam-api-service
spec:
  type: LoadBalancer
  selector:
    app: uam-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 42424
